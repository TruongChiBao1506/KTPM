global:
  scrape_interval: 15s  # Thời gian thu thập metrics

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']  # Giám sát chính Prometheus
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']  # Giám sát Node Exporter