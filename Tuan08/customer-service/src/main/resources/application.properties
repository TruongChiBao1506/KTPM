spring.application.name=customer-service
server.port=8083

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27019/customer-db

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.customer.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.customer.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customer.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.customer.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customer.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.customer.permittedNumberOfCallsInHalfOpenState=5

# Resilience4j Retry Configuration
resilience4j.retry.instances.customer.maxAttempts=3
resilience4j.retry.instances.customer.waitDuration=1000
resilience4j.retry.instances.customer.enableExponentialBackoff=true
resilience4j.retry.instances.customer.exponentialBackoffMultiplier=2

# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.customer.timeoutDuration=3s
resilience4j.timelimiter.instances.customer.cancelRunningFuture=true

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
