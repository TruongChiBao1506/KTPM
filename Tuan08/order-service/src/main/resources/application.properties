spring.application.name=order-service
server.port=8084

# Data Source Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order-db
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27018/order-db

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.order.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.order.slidingWindowSize=10
resilience4j.circuitbreaker.instances.order.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.order.failureRateThreshold=50
resilience4j.circuitbreaker.instances.order.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.order.permittedNumberOfCallsInHalfOpenState=5

# Resilience4j Retry Configuration
resilience4j.retry.instances.order.maxAttempts=3
resilience4j.retry.instances.order.waitDuration=1000
resilience4j.retry.instances.order.enableExponentialBackoff=true
resilience4j.retry.instances.order.exponentialBackoffMultiplier=2

# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.order.timeoutDuration=3s
resilience4j.timelimiter.instances.order.cancelRunningFuture=true

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.kafka=INFO
