spring.application.name=api-gateway
server.port=8080

# Spring Cloud Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes Configuration
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=lb://inventory-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.routes[3].id=customer-service
spring.cloud.gateway.routes[3].uri=lb://customer-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[5].id=shipping-service
spring.cloud.gateway.routes[5].uri=lb://shipping-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/shipping/**

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# Management
management.endpoints.web.exposure.include=*

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.gateway.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.gateway.slidingWindowSize=10
resilience4j.circuitbreaker.instances.gateway.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.gateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gateway.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.gateway.permittedNumberOfCallsInHalfOpenState=5

# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.gateway.timeoutDuration=5s
resilience4j.timelimiter.instances.gateway.cancelRunningFuture=true
