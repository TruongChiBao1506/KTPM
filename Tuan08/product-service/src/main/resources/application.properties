spring.application.name=product-service
server.port=8082

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/product-db

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.product.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.product.slidingWindowSize=10
resilience4j.circuitbreaker.instances.product.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.product.failureRateThreshold=50
resilience4j.circuitbreaker.instances.product.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.product.permittedNumberOfCallsInHalfOpenState=5

# Resilience4j Retry Configuration
resilience4j.retry.instances.product.maxAttempts=3
resilience4j.retry.instances.product.waitDuration=1000
resilience4j.retry.instances.product.enableExponentialBackoff=true
resilience4j.retry.instances.product.exponentialBackoffMultiplier=2

# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.product.timeoutDuration=3s
resilience4j.timelimiter.instances.product.cancelRunningFuture=true

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.kafka=INFO
