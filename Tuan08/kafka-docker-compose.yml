version: '3'
services:
  # Kafka for messaging
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka-network

  # MongoDB instances for each service
  mongodb-product:
    image: mongo:latest
    container_name: mongodb-product
    ports:
      - "27017:27017"
    volumes:
      - mongodb-product-data:/data/db
    networks:
      - kafka-network

  mongodb-order:
    image: mongo:latest
    container_name: mongodb-order
    ports:
      - "27018:27017"
    volumes:
      - mongodb-order-data:/data/db
    networks:
      - kafka-network

  mongodb-customer:
    image: mongo:latest
    container_name: mongodb-customer
    ports:
      - "27019:27017"
    volumes:
      - mongodb-customer-data:/data/db
    networks:
      - kafka-network

  # Kafka Manager - UI để quản lý Kafka (tùy chọn)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge

volumes:
  mongodb-product-data:
  mongodb-order-data:
  mongodb-customer-data:
